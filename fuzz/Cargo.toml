[package]
name = "swoole-rs-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
swoole-rs-base64 = { path = "../crates/base64" }
swoole-rs-framing = { path = "../crates/framing" }
swoole-rs-http = { path = "../crates/http" }
swoole-rs-oracle = { path = "../crates/oracle" }
swoole-rs-websocket = { path = "../crates/websocket" }

[[bin]]
name = "base64_decode"
path = "fuzz_targets/base64_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "base64_encode"
path = "fuzz_targets/base64_encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ws_decode"
path = "fuzz_targets/ws_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ws_frame_length"
path = "fuzz_targets/ws_frame_length.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ws_mask"
path = "fuzz_targets/ws_mask.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_cookies"
path = "fuzz_targets/http_cookies.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_url_decode"
path = "fuzz_targets/http_url_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_url_encode"
path = "fuzz_targets/http_url_encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "framing_length"
path = "fuzz_targets/framing_length.rs"
test = false
doc = false
bench = false

[[bin]]
name = "framing_unpack"
path = "fuzz_targets/framing_unpack.rs"
test = false
doc = false
bench = false

# Built only by `cargo +nightly fuzz`, outside the pinned stable workspace.
[workspace]
