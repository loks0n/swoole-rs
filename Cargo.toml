[workspace]
members = ["crates/ffi", "crates/websocket", "crates/buffer", "crates/timer", "crates/base64", "crates/oracle", "crates/crc32", "crates/error", "crates/protocols", "crates/memory", "crates/http", "crates/utilities", "crates/locks", "crates/wrappers", "crates/reactor", "crates/corebase", "crates/framing", "crates/coroutine", "crates/hooks", "crates/ossupport", "crates/tls", "crates/process", "crates/clients", "crates/inflate", "crates/httpbindings", "crates/http2", "crates/ports", "crates/phphelpers", "crates/phpcollections", "crates/phpevents", "crates/phpcoroutines"]
resolver = "3"

# A Rust panic must never unwind into PHP; tests still unwind.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# Lint levels live here only; see AGENTS.md "Rust lints".
[workspace.lints.clippy]
# Pedantic is denied whole (#156), including the cast lints that guard the FFI
# boundary against silent truncation, sign flips and misalignment (#157).
pedantic = { level = "deny", priority = -1 }
# Allowed: state-transition tables keep one arm per state, and merging arms
# would reorder guarded ones.
match_same_arms = "allow"
# Allowed: naming lints that flag FFI and protocol names (owner/owned,
# stage/state, SHA-1's a..e) and C-shaped option structs.
similar_names = "allow"
many_single_char_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
# Allowed: hot buffer paths inline on purpose.
inline_always = "allow"
# Allowed: protocol lengths and native type codes are decimal by nature.
decimal_bitwise_operands = "allow"
# Allowed until #213 fixes it.
wildcard_imports = "allow"
# Function size, at clippy.toml's thresholds (#159).
cognitive_complexity = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
missing_assert_message = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
