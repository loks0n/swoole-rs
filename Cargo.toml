[workspace]
members = ["crates/ffi", "crates/websocket", "crates/buffer", "crates/timer", "crates/base64", "crates/oracle", "crates/crc32", "crates/error", "crates/protocols", "crates/memory", "crates/http", "crates/utilities", "crates/locks", "crates/wrappers", "crates/reactor", "crates/corebase", "crates/framing", "crates/coroutine", "crates/hooks", "crates/ossupport", "crates/tls", "crates/process", "crates/clients", "crates/httpbindings", "crates/http2", "crates/ports", "crates/phphelpers", "crates/phpcollections", "crates/phpevents", "crates/phpcoroutines"]
resolver = "3"

# Lint levels live here only; see AGENTS.md "Rust lints".
[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
missing_assert_message = "deny"
