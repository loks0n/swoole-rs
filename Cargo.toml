[workspace]
members = ["crates/ffi", "crates/websocket", "crates/buffer", "crates/timer", "crates/base64", "crates/oracle", "crates/crc32", "crates/error", "crates/protocols", "crates/memory", "crates/http", "crates/utilities", "crates/locks", "crates/wrappers", "crates/reactor", "crates/corebase", "crates/framing", "crates/coroutine", "crates/hooks", "crates/ossupport", "crates/tls", "crates/process", "crates/clients", "crates/inflate", "crates/httpbindings", "crates/http2", "crates/ports", "crates/phphelpers", "crates/phpcollections", "crates/phpevents", "crates/phpcoroutines"]
resolver = "3"

# A Rust panic must never unwind into PHP; tests still unwind.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# Lint levels live here only; see AGENTS.md "Rust lints".
[workspace.lints.rust]
# `pub` only where another crate uses it, so dead_code sees the rest (#159).
unreachable_pub = "deny"

[workspace.lints.clippy]
# Silent truncation, sign flips and misaligned casts at the FFI boundary (#157).
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_ptr_alignment = "deny"
# Pedantic lints fixed by `cargo clippy --fix` (#156).
borrow_as_ptr = "deny"
semicolon_if_nothing_returned = "deny"
cast_lossless = "deny"
unreadable_literal = "deny"
checked_conversions = "deny"
enum_glob_use = "deny"
bool_to_int_with_if = "deny"
needless_bitwise_bool = "deny"
unnecessary_semicolon = "deny"
unnested_or_patterns = "deny"
range_plus_one = "deny"
ref_as_ptr = "deny"
if_not_else = "deny"
must_use_candidate = "deny"
doc_markdown = "deny"
manual_let_else = "deny"
redundant_else = "deny"
needless_continue = "deny"
single_match_else = "deny"
comparison_chain = "deny"
stable_sort_primitive = "deny"
ptr_as_ptr = "deny"
format_collect = "deny"
assert_is_empty = "deny"
items_after_statements = "deny"
unnecessary_box_returns = "deny"
trivially_copy_pass_by_ref = "deny"
cast_precision_loss = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
missing_assert_message = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
