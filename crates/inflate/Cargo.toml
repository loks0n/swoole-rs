[package]
name = "swoole-rs-inflate"
version = "0.1.0"
edition = "2024"

# Its own crate so its zlib references are separate archive members: only the
# patched C++ that calls them pulls them in, not every clients gate consumer.
[lib]
name = "swoole_rs_inflate"
crate-type = ["rlib"]

[dependencies]
libc = "=0.2.191"
# System zlib (the same libz the PHP build links), per #439's -sys decision.
libz-sys = { version = "1.1.20", default-features = false, features = ["libc"] }

[lints]
workspace = true
