[package]
name = "swoole-rs-uring-sys"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Raw liburing bindings, generated at build time from the system's liburing"
links = "uring"

[features]
# Bind the system liburing (pkg-config, >= 2.8). Without it the crate is empty, so
# the workspace builds and tests on machines without liburing (macOS).
liburing = ["dep:bindgen", "dep:cc", "dep:pkg-config"]

[build-dependencies]
bindgen = { version = "=0.73.2", default-features = false, features = ["runtime"], optional = true }
cc = { version = "=1.10.0", optional = true }
pkg-config = { version = "=0.3.34", optional = true }

[lints]
workspace = true
