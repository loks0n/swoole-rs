[package]
name = "swoole-rs-phpthread"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP Swoole\\Thread\\Map, ArrayList and Queue: values shared between threads"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:libc"]

[dependencies]
libc = { version = "=0.2.191", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }

[lints]
workspace = true
