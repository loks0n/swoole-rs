[package]
name = "swoole-rs-phpcollections"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "swoole_rs_phpcollections"
crate-type = ["rlib"]

[features]
# Swoole\Coroutine\Channel needs PHP headers (swoole-rs-zend-sys).
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php"]

[dependencies]
swoole-rs-zend = { path = "../zend", optional = true }

[lints]
workspace = true
