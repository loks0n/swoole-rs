[package]
name = "swoole-rs-phpcollections"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "swoole_rs_phpcollections"
crate-type = ["rlib"]

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = ["dep:swoole-rs-zend", "swoole-rs-zend/php", "dep:swoole-rs-memory"]

[dependencies]
swoole-rs-zend = { path = "../zend", optional = true }
swoole-rs-memory = { path = "../memory", optional = true }

[lints]
workspace = true
