[package]
name = "swoole-rs-clients"
version = "0.1.0"
edition = "2024"

[lib]
name = "swoole_rs_clients"
crate-type = ["rlib"]

[dependencies]
swoole-rs-base64 = { path = "../base64" }
libc = "=0.2.191"
# System zlib (the same libz the PHP build links), per #439's -sys decision.
libz-sys = { version = "1.1.20", default-features = false, features = ["libc"] }

[lints]
workspace = true
