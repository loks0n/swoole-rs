[package]
name = "swoole-rs-phphttp2"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PHP HTTP/2 client classes (Swoole\\Coroutine\\Http2\\Client, Swoole\\Http2\\Request, Swoole\\Http2\\Response) over the zend crate"

[features]
# Needs PHP headers (swoole-rs-zend-sys); without it the crate is empty.
php = [
    "dep:libc",
    "dep:swoole-rs-inflate",
    "dep:swoole-rs-http2",
    "dep:swoole-rs-phptable",
    "swoole-rs-phptable/php",
    "dep:swoole-rs-zend",
    "swoole-rs-zend/php",
]

[dependencies]
libc = { version = "=0.2.191", optional = true }
swoole-rs-inflate = { path = "../inflate", optional = true }
swoole-rs-http2 = { path = "../http2", optional = true }
swoole-rs-phptable = { path = "../phptable", optional = true }
swoole-rs-zend = { path = "../zend", optional = true }

[lints]
workspace = true
