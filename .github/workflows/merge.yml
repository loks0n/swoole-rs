name: Merge
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
concurrency:
  group: merge-${{ github.ref }}
jobs:
  full-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # rust-cache restores all of target/; hybrid build trees must start clean.
      - run: rm -rf target/hybrid
      - run: sudo apt-get update -q && sudo apt-get install -yq php-dev php-sqlite3 php-curl php-xml php-mbstring python3-pytest composer libclang-dev libpcre2-dev libssl-dev zlib1g-dev pkg-config cmake libgtest-dev libnghttp2-dev libpq-dev libcurl4-openssl-dev ccache
      # Caches are saved as soon as they are built, so a failing gate later does not discard
      # them; PR branches can only restore caches saved on main.
      - id: upstream
        uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: steps.upstream.outputs.cache-hit != 'true'
        run: python3 tools/build_upstream.py
      - if: steps.upstream.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/upstream
          key: ${{ steps.upstream.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: python3 corpus/thirdparty/hyperf.py --prepare
      - run: python3 tests/modules/buffer/baseline.py --sanitize
      # Unit, native, ABI, model and PHP gates, every application and original PHPT, upstream as control.
      - run: python3 tools/dev.py integrate --all-modules --php-extension pdo --php-extension pdo_sqlite --php-extension curl --php-extension sockets --php-extension tokenizer --external-network --php-sockets
      - if: always()
        run: python3 tools/merge_summary.py >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            target/reports/
            target/upstream/build.log
            target/hybrid/*/build-manifest.json
