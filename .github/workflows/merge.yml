name: Merge
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
# Latest wins: one run at a time; GitHub keeps only the newest push pending, so the
# next run always covers main's head. Never cancel-in-progress, or no run finishes.
concurrency:
  group: merge-${{ github.ref }}
jobs:
  # dev.py's phases are CPU-bound (about 77 CPU-minutes), so they run as two slices on two
  # runners. Each slice builds the all-modules hybrid and runs the builds; the rest is split
  # by tools/phase_weights.json (dev.py --shard).
  full-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      # Saved from main under a key the PR tier's hybrid and gates jobs restore.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      # rust-cache restores all of target/; hybrid build trees must start clean.
      - run: rm -rf target/hybrid
      - uses: ./.github/actions/install
      # Caches are saved as soon as they are built, so a failing gate later does not discard
      # them; PR branches can only restore caches saved on main.
      - id: upstream
        uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: steps.upstream.outputs.cache-hit != 'true'
        run: python3 tools/build_upstream.py
      - if: steps.upstream.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/upstream
          key: ${{ steps.upstream.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: python3 corpus/thirdparty/hyperf.py --prepare
      - run: python3 tests/modules/buffer/baseline.py --sanitize
      # Unit, native, ABI, model and PHP gates, every application and original PHPT, upstream as control.
      - run: python3 tools/dev.py integrate --all-modules --php-extension pdo --php-extension pdo_sqlite --php-extension curl --php-extension sockets --php-extension tokenizer --external-network --php-sockets --shard ${{ matrix.shard }}/2
      - if: always()
        run: python3 tools/merge_summary.py >> "$GITHUB_STEP_SUMMARY"
      - if: always() && matrix.shard == 1
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
      # Small on purpose: tools/ci.py downloads it to list failed, new and fixed phases.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phases-${{ matrix.shard }}
          path: target/reports/dev/*/loop.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports-${{ matrix.shard }}
          path: |
            target/reports/
            target/upstream/build.log
            target/hybrid/*/build-manifest.json

  # Every pinned PHPT on upstream and on the all-modules hybrid: any test that passes
  # on upstream must pass on the hybrid (corpus/upstream/gate.py).
  phpt-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - id: upstream
        uses: actions/cache@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: steps.upstream.outputs.cache-hit != 'true'
        run: python3 tools/build_upstream.py
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: |
          # Database hooks as upstream's own CI builds them (scripts/docker-compile.sh).
          services="--configure=--enable-swoole-pgsql --configure=--enable-mysqlnd"
          python3 tools/build_hybrid.py --backend upstream --php-sockets $services | tee upstream.log
          python3 tools/build_hybrid.py --php-sockets $services $(python3 -c 'from tools.build_hybrid import SELECTABLE; print(*(f"--module {m}" for m in SELECTABLE))') | tee hybrid.log
          mkdir -p target/phpt
          cp -L "$(sed -n 's/^\(Built\|Cached\) upstream: //p' upstream.log)" target/phpt/upstream.so
          cp -L "$(sed -n 's/^\(Built\|Cached\) rust: //p' hybrid.log)" target/phpt/hybrid.so
      - uses: actions/upload-artifact@v4
        with:
          name: phpt-engines
          path: target/phpt/

  # swoole_stdext needs the experimental --stdext build, which changes PHP itself
  # (typed arrays, methods on scalars), so it gets its own engines and its own gate.
  phpt-stdext:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: hashFiles('target/upstream/src/run-tests.php') == ''
        run: python3 tools/build_upstream.py
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: |
          python3 tools/build_hybrid.py --backend upstream --stdext | tee upstream.log
          python3 tools/build_hybrid.py --stdext $(python3 -c 'from tools.build_hybrid import SELECTABLE; print(*(f"--module {m}" for m in SELECTABLE))') | tee hybrid.log
          mkdir -p target/phpt
          cp -L "$(sed -n 's/^\(Built\|Cached\) upstream: //p' upstream.log)" target/phpt/upstream.so
          cp -L "$(sed -n 's/^\(Built\|Cached\) rust: //p' hybrid.log)" target/phpt/hybrid.so
          python3 corpus/upstream/inventory.py --output target/phpt/manifest.json
      - id: extensions
        run: echo "args=$(sed -n 's/^extension=\(.*\)/--php-extension \1/p' /etc/php/*/cli/conf.d/*.ini | sed 's/\.so$//' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - run: |
          for engine in upstream hybrid; do
            python3 corpus/upstream/run.py --manifest target/phpt/manifest.json --module swoole_stdext --timeout 30 \
              ${{ steps.extensions.outputs.args }} --engine $engine=target/phpt/$engine.so \
              --output target/phpt/stdext-$engine.json || [ $? -eq 1 ]
          done
      - run: python3 corpus/upstream/gate.py target/phpt/stdext-*.json --output phpt-stdext.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpt-stdext
          path: phpt-stdext.json

  phpt:
    needs: phpt-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4, 5, 6]
        engine: [upstream, hybrid]
    # The services upstream's PHPTs expect, as in its scripts/docker-compose.yml, under
    # the host names its tests/include/config.php uses on CI (httpbin at http://httpbin:80).
    services:
      httpbin:
        image: kennethreitz/httpbin
        ports: ['80:80']
      pgsql:
        image: postgres:14
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -proot" --health-interval 2s --health-retries 60
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          packages: php-gmp php-bcmath php-mysql php-pgsql
      - run: echo '127.0.0.1 httpbin pgsql mysql redis' | sudo tee -a /etc/hosts
      - uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: phpt-engines
          path: target/phpt
      - run: python3 corpus/upstream/inventory.py --shard ${{ matrix.index }}/6 --output target/phpt/manifest.json
      # php -n loads nothing; load every extension the distribution enables, in its order.
      - id: extensions
        run: echo "args=$(sed -n 's/^extension=\(.*\)/--php-extension \1/p' /etc/php/*/cli/conf.d/*.ini | sed 's/\.so$//' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      # Exit 1 means some tests failed, which the gate judges; anything else (a runner
      # crash) fails the shard.
      - run: >
          python3 corpus/upstream/run.py --manifest target/phpt/manifest.json --timeout 30 --external-network
          ${{ steps.extensions.outputs.args }}
          --engine ${{ matrix.engine }}=target/phpt/${{ matrix.engine }}.so
          --output target/phpt/${{ matrix.engine }}-${{ matrix.index }}.json || [ $? -eq 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpt-${{ matrix.engine }}-${{ matrix.index }}
          path: target/phpt/${{ matrix.engine }}-${{ matrix.index }}.json

  phpt-gate:
    needs: phpt
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phpt-*-*
          merge-multiple: true
          path: shards
      - run: python3 corpus/upstream/gate.py shards/*.json --output phpt.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpt
          path: phpt.json
      - if: needs.phpt.result != 'success'
        run: echo "A PHPT shard crashed; its tests are missing from the gate" && exit 1

  # musl and PHP 8.5, as on php:8.5-alpine in Appwrite's base image: build the
  # reference and the all-modules hybrid, then run the corpus and original PHPTs
  # against both. Project 11 needs --fix-halfclose and is covered by the PR tier.
  alpine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: php:8.5-alpine
    env:
      PHP_EXTENSIONS: --php-extension sockets --php-extension pcntl
    steps:
      - run: apk add --no-cache git && git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - run: .devcontainer/install-alpine.sh && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: python3 tools/build_upstream.py --php-sockets
      - run: cargo fetch --locked
      - run: python3 tools/build_hybrid.py --php-sockets $(python3 -c "from tools.build_hybrid import SELECTABLE; print(' '.join('--module ' + m for m in SELECTABLE))")
      - run: python3 corpus/thirdparty/hyperf.py --prepare
      - run: >
          python3 corpus/run.py $PHP_EXTENSIONS --require-all
          $(for p in 01-hello 02-router 03-notes 04-job-service 05-coroutines 06-websocket 07-tcp-framing 08-timers 09-shared-table 10-task-workers 12-hyperf-skeleton; do echo --project $p; done)
          --engine upstream=target/upstream/src/modules/swoole.so
          --engine hybrid=$(echo target/hybrid/rust-*-php-sockets)/modules/swoole.so
          --output target/reports/alpine-corpus.json
      - if: always()
        run: >
          python3 corpus/upstream/run.py $PHP_EXTENSIONS
          --engine upstream=target/upstream/src/modules/swoole.so
          --engine hybrid=$(echo target/hybrid/rust-*-php-sockets)/modules/swoole.so
          --output target/reports/alpine-phpt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpine-reports
          path: target/reports/
