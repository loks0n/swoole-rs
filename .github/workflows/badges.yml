name: Badges
# README progress badges: shields.io endpoint JSON (tools/badges.py) on the `badges`
# branch. The static ones update on every push to main; the PHPT one when a merge-tier
# run on main completes, from that run's gate.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Merge]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: badges
defaults:
  run:
    shell: bash
jobs:
  badges:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          pin=$(python3 -c 'from tools.build_upstream import COMMIT; print(COMMIT)')
          git init -q target/pin
          git -C target/pin fetch -q --depth 1 https://github.com/swoole/swoole-src "$pin"
          git -C target/pin checkout -q FETCH_HEAD
      # The newest completed merge-tier run on main with a gate result (cancelled runs have none).
      - id: gate
        run: |
          for run in $(gh run list --workflow merge.yml --branch main --status completed --limit 20 --json databaseId -q '.[].databaseId'); do
            if gh run download "$run" -n phpt -D gate 2>/dev/null; then
              echo "commit=$(gh run view "$run" --json headSha -q .headSha)" >> "$GITHUB_OUTPUT"
              break
            fi
          done
      - run: git clone -q --depth 1 --branch badges "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" out || git init -q -b badges out
      - run: >
          python3 tools/badges.py --source target/pin --output out
          ${{ steps.gate.outputs.commit && format('--phpt gate/phpt.json --commit {0}', steps.gate.outputs.commit) || '' }}
      - working-directory: out
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "badges for ${GITHUB_SHA::7}"
          git push -q "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:badges
