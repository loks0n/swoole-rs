name: io_uring
# Upstream and the all-modules hybrid built with --enable-iouring --enable-uring-socket,
# then the original PHPTs upstream's own io_uring CI runs (scripts/run-tests.sh with
# SWOOLE_IOURING), plus the families whose code paths io_uring replaces (System::sleep,
# waitpid, coroutine locks). Any test that passes on upstream must pass on the hybrid.
# Called by the merge tier, and by the PR tier when a PR touches io_uring code.
on:
  workflow_call:
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
defaults:
  run:
    shell: bash

jobs:
  phpt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - uses: actions/cache/restore@v4
        with:
          path: target/upstream
          key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
      - if: hashFiles('target/upstream/src/run-tests.php') == ''
        run: python3 tools/build_upstream.py
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - run: cargo fetch --locked
      - run: |
          iouring="--configure=--enable-iouring --configure=--enable-uring-socket"
          python3 tools/build_hybrid.py --backend upstream $iouring | tee upstream.log
          python3 tools/build_hybrid.py $iouring $(python3 -c 'from tools.build_hybrid import SELECTABLE; print(*(f"--module {m}" for m in SELECTABLE))') | tee hybrid.log
          mkdir -p target/phpt
          cp -L "$(sed -n 's/^\(Built\|Cached\) upstream: //p' upstream.log)" target/phpt/upstream.so
          cp -L "$(sed -n 's/^\(Built\|Cached\) rust: //p' hybrid.log)" target/phpt/hybrid.so
          for engine in upstream hybrid; do php -n -d extension=$PWD/target/phpt/$engine.so --ri swoole | grep -E 'io_uring|uring_socket'; done
          python3 corpus/upstream/inventory.py --output target/phpt/manifest.json
      - id: extensions
        run: echo "args=$(sed -n 's/^extension=\(.*\)/--php-extension \1/p' /etc/php/*/cli/conf.d/*.ini | sed 's/\.so$//' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - run: |
          families="--module swoole_iouring --module swoole_runtime --module swoole_coroutine_lock --module swoole_coroutine_system"
          mkdir -p target/phpt/iouring
          for engine in upstream hybrid; do
            python3 corpus/upstream/run.py --manifest target/phpt/manifest.json $families --timeout 30 \
              ${{ steps.extensions.outputs.args }} --engine $engine=target/phpt/$engine.so \
              --output target/phpt/iouring/$engine.json || [ $? -eq 1 ]
          done
          corpus/upstream/recheck.sh target/phpt/iouring target/phpt target/phpt/recheck \
            --manifest target/phpt/manifest.json --timeout 30 ${{ steps.extensions.outputs.args }}
          set -- target/phpt/iouring/*.json
          if ls target/phpt/recheck/*.json >/dev/null 2>&1; then set -- "$@" --recheck target/phpt/recheck/*.json; fi
          python3 corpus/upstream/gate.py "$@" --output phpt-iouring.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpt-iouring
          path: |
            phpt-iouring.json
            target/phpt/iouring/
            target/phpt/recheck/
