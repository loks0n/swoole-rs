name: Appwrite base
# appwrite/docker-base with only its Swoole stage replaced (tools/appwrite_base.py):
# `hybrid` is the all-modules hybrid, `upstream` stock Swoole at the same pin as the
# control, so the two images differ only in swoole.so.
on:
  workflow_dispatch:
  workflow_call:
env:
  DOCKER_BASE_COMMIT: fd467ebe3b4ddcb6469078d3b41b2a67f7ca6fdf
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [hybrid, upstream]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: appwrite/docker-base
          ref: ${{ env.DOCKER_BASE_COMMIT }}
          path: docker-base
      - run: python3 tools/appwrite_base.py docker-base/Dockerfile --variant ${{ matrix.variant }} --output docker-base/Dockerfile.swoole-rs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "name=ghcr.io/${{ github.repository }}/appwrite-base:${{ github.sha }}${{ matrix.variant == 'upstream' && '-upstream' || '' }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: docker-base
          file: docker-base/Dockerfile.swoole-rs
          target: final
          build-contexts: swoole-rs=.
          load: true
          tags: ${{ steps.tag.outputs.name }}
          cache-from: type=gha,scope=appwrite-base-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=appwrite-base-${{ matrix.variant }}
      - run: |
          { echo '### ${{ matrix.variant }}: `${{ steps.tag.outputs.name }}`'; echo '```'; docker run --rm ${{ steps.tag.outputs.name }} php --ri swoole; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: docker push ${{ steps.tag.outputs.name }}
