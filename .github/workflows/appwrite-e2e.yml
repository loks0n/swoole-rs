name: Appwrite e2e
# Appwrite's e2e service suites on Appwrite images built from the two base images of
# appwrite-base.yml (stock Swoole and the all-modules hybrid), at one Appwrite commit.
# A test that passes on stock and fails on the hybrid fails the run; tests that fail
# on stock are listed, not gated (tools/appwrite_e2e.py).
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'all, or bench to skip the e2e suites'
        default: all
        type: choice
        options: [all, bench]
  schedule:
    - cron: '0 4 * * 1'
env:
  # Builds on appwrite/base:2.2.7, which is appwrite-base.yml's DOCKER_BASE_COMMIT.
  APPWRITE_COMMIT: b26974e732e8b53f03fe30577ed8c79150f6106e
  APPWRITE_BASE: appwrite/base:2.2.7
permissions:
  contents: read
  packages: write
jobs:
  base:
    uses: ./.github/workflows/appwrite-base.yml

  appwrite:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [hybrid, upstream]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: appwrite/appwrite
          ref: ${{ env.APPWRITE_COMMIT }}
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: development
          build-args: |
            DEBUG=false
            TESTING=true
            VERSION=dev
          build-contexts: ${{ env.APPWRITE_BASE }}=docker-image://ghcr.io/${{ github.repository }}/appwrite-base:${{ github.sha }}${{ matrix.variant == 'upstream' && '-upstream' || '' }}
          push: true
          tags: ghcr.io/${{ github.repository }}/appwrite-e2e:${{ github.sha }}-${{ matrix.variant }}
          cache-from: type=gha,scope=appwrite-e2e-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=appwrite-e2e-${{ matrix.variant }}

  services:
    if: inputs.suite != 'bench'
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - id: list
        run: |
          curl -fsSL "https://raw.githubusercontent.com/appwrite/appwrite/${APPWRITE_COMMIT}/.github/ci/e2e.json" \
            | jq -c '[.services[] | del(.paths)]' | sed 's/^/services=/' >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e / ${{ matrix.service.name }} / ${{ matrix.variant }}
    needs: [appwrite, services]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [hybrid, upstream]
        service: ${{ fromJSON(needs.services.outputs.services) }}
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml
      COMPOSE_PROFILES: postgresql${{ matrix.service.documentsdb && ',mongodb' || '' }}${{ matrix.service.embedding && ',embedding' || '' }}${{ matrix.service.name == 'VCSGitea' && ',gitea' || '' }}
      _APP_DB_ADAPTER: postgresql
      _APP_DB_HOST: postgresql
      _APP_DB_PORT: 5432
      _APP_EMBEDDING: ${{ matrix.service.embedding && 'enabled' || '' }}
      _APP_STORAGE_LIMIT: 134217728
      _APP_OPTIONS_ROUTER_PROTECTION: enabled
      _APP_BROWSER_HOST: http://invalid-browser/v1
      _APP_DOCUMENTSDB: enabled
      _APP_VECTORSDB: enabled
      _APP_MAINTENANCE_INACTIVE_INTERVAL: ${{ matrix.service.name == 'Projects' && '30' || '' }}
      SERVICE: ${{ matrix.service.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: appwrite/appwrite
          ref: ${{ env.APPWRITE_COMMIT }}
          submodules: recursive
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull images
        run: |
          image=ghcr.io/${{ github.repository }}/appwrite-e2e:${{ github.sha }}-${{ matrix.variant }}
          docker pull --quiet "$image" && docker tag "$image" appwrite-dev
          docker compose pull --quiet --ignore-buildable
      - name: Provision Gitea
        if: matrix.service.name == 'VCSGitea'
        run: |
          docker compose up -d --wait gitea
          docker compose exec -T gitea /setup.sh
          creds=$(docker compose exec -T gitea cat /data/gitea/oauth.json)
          echo "_APP_VCS_GITEA_CLIENT_ID=$(echo "$creds" | jq -r .client_id)" >> "$GITHUB_ENV"
          echo "_APP_VCS_GITEA_CLIENT_SECRET=$(echo "$creds" | jq -r .client_secret)" >> "$GITHUB_ENV"
      # A helper with no Swoole in it (exiftool, a database) that comes up unhealthy is
      # recreated and waited for once more. A service built from appwrite-dev runs the engine
      # under test, so it fails at once. Only the failed helpers are recreated: Gitea's
      # provisioned state above must survive.
      - name: Start the stack
        timeout-minutes: 10
        run: |
          docker compose up -d --quiet-pull --wait && exit 0
          bad=$(docker compose ps --all --format json | jq -r '(if type == "array" then .[] else . end)
            | select(.Health == "unhealthy" or (.State != "running" and .ExitCode != 0))
            | "\(.Image) \(.Service)"')
          echo "Failed to start: ${bad:-unknown}"
          if [ -z "$bad" ] || echo "$bad" | grep -q '^appwrite-dev '; then exit 1; fi
          # shellcheck disable=SC2046 # one service name per word
          docker compose rm --force --stop --volumes $(echo "$bad" | cut -d' ' -f2)
          docker compose up -d --quiet-pull --wait
      - name: Wait for Open Runtimes
        timeout-minutes: 3
        run: until docker logs exc1 2>&1 | grep -q "Executor is ready."; do sleep 1; done
      - name: First organization creation
        if: matrix.service.name == 'Teams'
        timeout-minutes: 2
        run: |
          until [ "$(docker compose exec -T appwrite curl -s -o /dev/null -w '%{http_code}' -H 'X-Appwrite-Project: console' http://appwrite/v1/account)" = 401 ]; do sleep 1; done
          docker compose exec -T -e _APP_E2E_FRESH_INSTANCE=enabled appwrite \
            test tests/e2e/Services/Teams/TeamsConsoleClientTest.php --filter=testCreateOrganization
      # Failing tests are compared afterwards, so this step only fails when no report exists.
      - name: Run tests
        timeout-minutes: 30
        run: |
          docker compose exec -T -e CI appwrite vendor/bin/paratest \
            --processes "${{ matrix.service.processes || '$(nproc)' }}" \
            ${{ matrix.service.functional && '--functional' || '' }} \
            "/usr/src/code/tests/e2e/Services/$SERVICE" \
            --exclude-group abuseEnabled --exclude-group screenshots --exclude-group antivirus \
            --exclude-group queueRetry --exclude-group usageOutage \
            --log-junit "tests/e2e/Services/$SERVICE/junit.xml" || true
          test -s "tests/e2e/Services/$SERVICE/junit.xml"
      - if: failure()
        run: docker compose logs --timestamps --tail 2000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.variant }}-${{ matrix.service.name }}
          path: tests/e2e/Services/${{ matrix.service.name }}/junit.xml
          if-no-files-found: ignore

  # Endpoint load on both images, alternating variants on one runner over three trials (#88).
  bench:
    needs: appwrite
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml
      COMPOSE_PROFILES: postgresql
      _APP_DB_ADAPTER: postgresql
      _APP_DB_HOST: postgresql
      _APP_DB_PORT: 5432
      _APP_OPTIONS_ROUTER_PROTECTION: enabled
    steps:
      - uses: actions/checkout@v4
        with:
          path: swoole-rs
      - uses: actions/checkout@v4
        with:
          repository: appwrite/appwrite
          ref: ${{ env.APPWRITE_COMMIT }}
          submodules: recursive
          path: appwrite
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get install -y -q apache2-utils
      - name: Pull images
        working-directory: appwrite
        run: |
          for variant in hybrid upstream; do
            docker pull --quiet ghcr.io/${{ github.repository }}/appwrite-e2e:${{ github.sha }}-$variant
          done
          docker compose pull --quiet --ignore-buildable
      - name: Load
        working-directory: appwrite
        run: |
          for trial in 1 2 3; do
            for variant in hybrid upstream; do
              docker tag ghcr.io/${{ github.repository }}/appwrite-e2e:${{ github.sha }}-$variant appwrite-dev
              docker compose up -d --quiet-pull --wait
              timeout 120 sh -c 'until curl -sf http://localhost/v1/health/version >/dev/null; do sleep 1; done'
              ab -q -k -n 500 -c 8 http://localhost/v1/health/version >/dev/null  # warm up
              python3 ../swoole-rs/tools/appwrite_bench.py run $variant $trial ../bench
              docker compose down -v --remove-orphans
            done
          done
      - shell: bash  # pipefail, so failed or non-2xx requests fail the job through tee
        run: python3 swoole-rs/tools/appwrite_bench.py report bench | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appwrite-bench
          path: bench/

  compare:
    needs: e2e
    if: always() && contains(fromJSON('["success", "failure"]'), needs.e2e.result)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit
      - shell: bash  # pipefail, so the comparison fails the job through tee
        run: python3 tools/appwrite_e2e.py junit | tee -a "$GITHUB_STEP_SUMMARY"
