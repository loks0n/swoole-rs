name: WebSocket RFC conformance
on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Include long performance and compression stress cases
        type: boolean
        default: false
jobs:
  autobahn:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y php-dev libssl-dev libpcre2-dev pkg-config
      - run: python3 tools/build_upstream.py
      - run: python3 tools/build_hybrid.py
      - run: docker pull crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074
      - run: python3 tests/modules/websocket/autobahn.py ${{ inputs.full_suite && '--full' || '' }} --engine upstream=target/upstream/src/modules/swoole.so --engine hybrid=target/hybrid/rust/modules/swoole.so --output target/reports/autobahn.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfc-conformance-results
          path: target/reports/
