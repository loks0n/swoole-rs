name: PHPT environment
description: >-
  What upstream's PHPTs expect beside the services, for the phpt shards and the
  phpt-gate re-runs alike: client packages, service host names, the ODBC DSN,
  upstream's test tables and its composer test libraries, plus both engines.
inputs:
  php:
    description: The PHP package version the engines were built against
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/install
      with:
        packages: php-gmp php-bcmath php-mysql php-pgsql unixodbc odbc-mariadb libfbclient2
        php: ${{ inputs.php }}
    - shell: bash
      run: echo '127.0.0.1 httpbin pgsql mysql redis firebirdsql' | sudo tee -a /etc/hosts
    # The ODBC driver and the mysql-test DSN, as upstream's tests/init writes them, with the
    # driver's full path (Ubuntu installs it outside the loader's default directories).
    - shell: bash
      run: |
        printf '[mysql]\nDriver=%s\nDescription=MariaDB Connector/ODBC(Unicode)\nUsageCount=1\n' \
          "$(dpkg -L odbc-mariadb | grep '/libmaodbc.so$' | head -1)" | sudo tee /etc/odbcinst.ini
        printf '[mysql-test]\nDescription = MySQL test database\nDriver = mysql\nSERVER = mysql\nUSER = root\nPASSWORD = root\nPORT = 3306\nDATABASE = test\n' \
          | sudo tee /etc/odbc.ini
    - uses: actions/cache/restore@v4
      with:
        path: target/upstream
        key: upstream-${{ runner.os }}-${{ hashFiles('tools/build_upstream.py') }}
        fail-on-cache-miss: true
    # Upstream's test tables, which its tests/init --mysql loads from tests/test.sql.
    - shell: bash
      run: >
        php -r '$m = new mysqli("mysql", "root", "root", "test");
        $m->multi_query(file_get_contents("target/upstream/src/tests/test.sql")) or exit($m->error . "\n");
        do { if ($m->errno) exit($m->error . "\n"); } while ($m->more_results() && $m->next_result());'
    - uses: actions/download-artifact@v4
      with:
        name: phpt-engines
        path: target/phpt
    # The httpbin/guzzle/symfony cases require composer libraries the pin ships a
    # composer.json for but no lock; install them from the committed lock into the
    # upstream tree, where corpus/upstream/run.py copies the vendor dir into each
    # sandbox. Reproducible (exact lock) and cached on the lock hash.
    - uses: actions/cache@v4
      with:
        path: ~/.cache/composer
        key: composer-${{ runner.os }}-${{ hashFiles('corpus/upstream/lib-composer.lock') }}
    # A resolve/platform failure drops any partial vendor, so run.py falls back to its
    # stub and the lib-free cases still run, exactly as before this install existed.
    - shell: bash
      run: |
        cp corpus/upstream/lib-composer.lock target/upstream/src/tests/include/lib/composer.lock
        composer install --no-interaction --no-progress \
          --working-dir=target/upstream/src/tests/include/lib \
          || rm -rf target/upstream/src/tests/include/lib/vendor
